name: 3-Stage AI Governance Pipeline

on: [push]

jobs:
  governance-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for Agent 2 to save Release Notes

    steps:
      # --- SETUP ---
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      # --- AGENT 1: Policy Enforcement ---
      # This script now reads 'release_policy.md' from the repo
      - name: 🛡️ [Agent 1] Policy & Input Governance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python release_guard.py

      # --- AGENT 2: Documentation Scribe ---
      # Generates notes based on Jira DB
      - name: 📝 [Agent 2] Release Note Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_release_scribe.py

      # --- AGENT 3: Risk Analyst ---
      # Audits status and predicts resource needs
      - name: 🧠 [Agent 3] Risk & Dependency Analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_risk_analyst.py

      # --- REPORTING ---
      - name: Upload Governance Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: |
            RELEASE_NOTES.md
            BLOCKER_ANALYSIS.md