name: 3-Stage AI Governance Pipeline
on: [push]

jobs:
  governance-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      # --- SETUP ---
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      # --- AGENT 1: Policy Enforcement ---
      - name: 🛡️ [Agent 1] Policy & Input Governance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python release_guard.py

      # --- AGENT 2: Documentation Scribe ---
      # We use 'continue-on-error' here just in case API fails, 
      # so Agent 3 can still try to run (though it might fail too).
      - name: 📝 [Agent 2] Release Note Generator
        id: scribe
        continue-on-error: true 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_release_scribe.py

      # --- AGENT 3: Risk Analyst ---
      # This is the GATEKEEPER. If this fails, the build turns RED.
      - name: 🧠 [Agent 3] Risk & Dependency Analyst
        id: analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_risk_analyst.py

      # --- REPORTING (Run even if Agent 3 failed) ---
      - name: Upload Governance Artifacts
        if: always()  # Runs even if previous steps failed
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: |
            RELEASE_NOTES.md
            BLOCKER_ANALYSIS.md
          if-no-files-found: warn # Don't crash if files are missing