name: AI Release Governance

# Trigger: Run this whenever code is pushed
on: [push]

jobs:
  ai-check:
    runs-on: ubuntu-latest
    steps:
      # 1. Download the code to the runner
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install Google GenAI SDK
      - name: Install Dependencies
        run: pip install google-genai

      # 4. Run the AI Script
      - name: 🛑 Run AI Gatekeeper
        env:
          # Pass the Secret from GitHub to the Script
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Pass the actual commit message automatically
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python release_guard.py
