name: AI Release Governance

on: [push]

jobs:
  release-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need permission to commit the new Release Note file

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Important: Fetch full history for git log

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      # --- AGENT 1: The Gatekeeper (Your existing check) ---
      - name: 🛡️ Run Governance Gatekeeper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python release_guard.py

      # --- AGENT 2: The Scribe (Generate Notes) ---
      - name: 📝 Run Release Scribe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_release_scribe.py

      # --- AGENT 3: The Auditor (Check Jira) ---
      - name: 🕵️ Run Jira Auditor
        run: python agent_jira_auditor.py

      # --- BONUS: Upload the Notes to the Run Summary ---
      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md