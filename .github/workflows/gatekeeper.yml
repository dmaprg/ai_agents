name: 3-Stage AI Governance Pipeline

on: [push]

jobs:
  governance-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <--- CRITICAL: Allows the bot to push commits

    steps:
      # --- SETUP ---
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      # --- AGENT 1: Policy Enforcement ---
      - name: 🛡️ [Agent 1] Policy & Input Governance
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python release_guard.py

      # --- AGENT 2: Documentation Scribe ---
      - name: 📝 [Agent 2] Release Note Generator
        id: scribe
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_release_scribe.py

      # --- AGENT 3: Risk Analyst ---
      - name: 🧠 [Agent 3] Risk & Dependency Analyst
        id: analyst
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_risk_analyst.py

      # --- REPORTING PHASE (Commit to Repo) ---
      - name: 💾 Commit Reports to Repo
        if: always()  # Run even if Agent 3 failed (Blocked Release)
        run: |
          # 1. Configure Git User for the Bot
          git config --global user.name "AI Governance Bot"
          git config --global user.email "bot@noreply.github.com"
          
          # 2. Create Dynamic Folder Name (Year-Month-Day-RunNumber)
          # Example: reports/2026-02-10-run-45
          REPORT_DATE=$(date +'%Y-%m-%d')
          REPORT_DIR="reports/$REPORT_DATE-run-${{ github.run_number }}"
          
          mkdir -p $REPORT_DIR
          echo "📂 Created directory: $REPORT_DIR"

          # 3. Move Generated Files (If they exist)
          [ -f RELEASE_NOTES.md ] && mv RELEASE_NOTES.md $REPORT_DIR/
          [ -f BLOCKER_ANALYSIS.md ] && mv BLOCKER_ANALYSIS.md $REPORT_DIR/
          
          # 4. Check if folder is empty (If Agent 1 failed, no reports exist)
          if [ -z "$(ls -A $REPORT_DIR)" ]; then
             echo "⚠️ No reports generated to commit."
             exit 0
          fi
          
          # 5. Commit and Push
          git add $REPORT_DIR
          git commit -m "📝 Add Governance Reports for Run ${{ github.run_number }}"
          git push