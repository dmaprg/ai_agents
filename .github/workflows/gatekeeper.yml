name: AI Release Governance

on: [push]

jobs:
  predictive-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To save the Release Notes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install google-genai

      # AGENT 1: Generate Notes from Jira DB (If missing)
      - name: 📝 Run Release Scribe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_release_scribe.py

      # AGENT 2: Analyze Risks
      - name: 🧠 Run Risk Analyst Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent_risk_analyst.py

      # UPLOAD ARTIFACTS (Always run this, even if Agent 2 fails)
      - name: Upload Release Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            RELEASE_NOTES.md
            BLOCKER_ANALYSIS.md